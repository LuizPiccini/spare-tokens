schema_version: "0.1"
github:
  - id: scikit-learn-help-wanted
    repository: scikit-learn/scikit-learn
    project_name: scikit-learn
    project_url: https://scikit-learn.org
    cause_area: science
    labels:
      - help wanted
    task_type: issue-triage
    difficulty: medium
    estimated_minutes: 90
    human_minutes: 15
    risk_level: low
    importance: scikit-learn is core scientific and machine-learning infrastructure used by researchers, civic technologists, educators, and applied teams.
    beneficiaries:
      - scientific Python users
      - machine-learning practitioners
      - maintainers
    notes: Prefer bounded reproductions, tests, documentation clarifications, and issue narrowing over broad algorithm design work.

