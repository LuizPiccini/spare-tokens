    task_type: minimal-repro
    difficulty: low
    estimated_minutes: 75
    human_minutes: 15
    risk_level: low
    importance: SciPy underpins scientific computing, engineering, education, and research workflows across many public-good domains.
    beneficiaries:
      - researchers
      - scientific Python users
      - maintainers
    notes: Favor tasks with small reproductions, benchmark evidence, documentation gaps, or targeted tests.

